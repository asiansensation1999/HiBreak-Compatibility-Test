name: Build HiBreak Wi-Fi 0.4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract full Wi-Fi source
        run: unzip -q HiBreak-WiFi-v0.4-source.zip -d full-wifi

      - name: Build APK
        run: gradle --no-daemon -p full-wifi :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HiBreak-WiFi-0.4-debug
          path: full-wifi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
